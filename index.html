<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Marinade : gestion de restaurant, caisse, cuisine et paiements Mobile Money." />
  <meta name="theme-color" content="#C2410C" />
  <title>Marinade</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <svg width="56" height="56" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="var(--initial-loader-color)" />
          <path d="M12 35V14.5c0-.9 1.1-1.3 1.7-.7L24 24l10.3-10.2c.6-.6 1.7-.2 1.7.7V35" stroke="#fff"
            stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Couleurs du chargeur initial, avant que l'application ne démarre (thème retenu par l'utilisateur).
    const dark = localStorage.getItem('marinade.theme') === 'dark'
    document.documentElement.style.setProperty('--initial-loader-bg', dark ? '#171412' : '#F6F4F2')
    document.documentElement.style.setProperty('--initial-loader-color', dark ? '#EA6A2B' : '#C2410C')
  </script>
</body>

</html>
